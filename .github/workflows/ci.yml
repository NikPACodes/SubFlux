name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:

jobs:
  tests:
    name: SubFlux tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: subflux_db
          POSTGRES_USER: subflux
          POSTGRES_PASSWORD: subflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U subflux -d subflux_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.test
      
      POSTGRES_NAME: subflux_db
      POSTGRES_USER: subflux
      POSTGRES_PASSWORD: subflux
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U subflux -d subflux_test && break
            sleep 1
          done

      - name: Verify Django configuration
        run: |
          python manage.py check

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          pytest -q
