name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: subflux_test
          POSTGRES_USER: subflux
          POSTGRES_PASSWORD: subflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U subflux -d subflux_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://subflux:subflux@127.0.0.1:5432/subflux_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U subflux -d subflux_test && break
            sleep 1
          done

      # Прогон миграций перед тестами
      - name: Django migrate (CI)
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          pytest -q